<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QEMMA — Marketing that moves the numbers</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F6FA;--surface:#FFFFFF;--ink:#0B2545;--muted:#4B5F78;--line:#CFDCE8;--accent:#1B6CB0;--accent-ink:#FFFFFF;--teal:#17B5A0;--logofilter:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07172C;--surface:#0E2340;--ink:#EAF2FA;--muted:#9DB0C6;--line:#1F3858;--accent:#2FD0B8;--accent-ink:#07172C;--teal:#2FD0B8;--logofilter:brightness(1.45) saturate(1.1);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07172C;--surface:#0E2340;--ink:#EAF2FA;--muted:#9DB0C6;--line:#1F3858;--accent:#2FD0B8;--accent-ink:#07172C;--teal:#2FD0B8;--logofilter:brightness(1.45) saturate(1.1);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;margin:0;letter-spacing:-.02em;line-height:1.05}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(1.25rem,5vw,3rem)}
header.top{display:flex;justify-content:space-between;align-items:center;padding:1.5rem 0}
.brand{display:flex;align-items:center;gap:.7rem;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.25rem;letter-spacing:.14em;text-decoration:none}.brand img{height:40px;width:auto;filter:var(--logofilter)}.hero{position:relative;isolation:isolate}.heromark{position:absolute;right:0;top:50%;transform:translateY(-52%);width:min(48vw,440px);opacity:.13;z-index:-1;pointer-events:none;filter:var(--logofilter)}
nav a{margin-left:1.5rem;text-decoration:none;color:var(--muted)}
nav a:hover{color:var(--ink)}
.hero{padding:clamp(3rem,10vw,7rem) 0 clamp(2.5rem,6vw,4.5rem)}
.hero h1{font-size:clamp(2.6rem,8.5vw,6.5rem);font-weight:700;max-width:14ch}
.hero p{max-width:52ch;color:var(--muted);font-size:1.2rem;margin:1.75rem 0 2rem}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:.85rem 1.4rem;border-radius:999px;text-decoration:none;font-weight:500}
.stats{display:flex;flex-wrap:wrap;gap:2.5rem;border-top:1px solid var(--line);padding:1.75rem 0;margin-top:3.5rem}
.stats b{display:block;font:700 1.9rem "Bricolage Grotesque",sans-serif}
.stats span{color:var(--muted);font-size:.95rem}
section{padding:clamp(2.5rem,7vw,5rem) 0}
section>.wrap>h2{font-size:clamp(1.9rem,4.5vw,3rem);margin-bottom:1.5rem}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2rem}
.filters button{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.4rem 1rem;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:1.25rem}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.proj:first-child{grid-column:1/-1}
.thumb{text-shadow:0 1px 8px rgba(0,0,0,.25);aspect-ratio:16/9;display:grid;place-items:center;font:700 clamp(2rem,5vw,3.4rem) "Bricolage Grotesque",sans-serif;color:#fff;letter-spacing:-.03em}
.proj:first-child .thumb{text-shadow:0 1px 8px rgba(0,0,0,.25);aspect-ratio:21/8}
.proj .body{padding:1.25rem 1.4rem 1.5rem}
.proj h3{font-size:1.5rem;margin-bottom:.4rem}
.proj p{margin:0 0 .9rem;color:var(--muted)}
.tag{font-size:.9rem;color:var(--muted)}
.updates{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.updates li{position:relative;padding:0 0 2rem 1.75rem;max-width:62ch}
.updates li::before{content:"";position:absolute;left:-7px;top:.55rem;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.updates time{color:var(--muted);font-size:.95rem}
.updates h3{font-size:1.35rem;margin:.15rem 0 .35rem}
.updates p{margin:0;color:var(--muted)}
.contact{background:var(--ink);color:var(--bg);border-radius:28px;padding:clamp(2rem,6vw,4rem);margin-bottom:3rem}
.contact h2{font-size:clamp(2rem,5vw,3.4rem);max-width:16ch}
.contact a.btn{margin-top:1.75rem;background:var(--bg);color:var(--ink)}
footer{color:var(--muted);padding:0 0 2.5rem;font-size:.95rem}
.svc-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:1rem;margin-bottom:2rem}.svc-head h2{margin:0}.svc-lead{max-width:60ch;color:var(--muted);margin:.75rem 0 0}.lang{display:flex;gap:.4rem}.lang button{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.35rem 1rem;cursor:pointer}.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:1.1rem}.svc{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:14px;padding:1.3rem 1.4rem}.svc h3{font-size:1.25rem;margin-bottom:.7rem;line-height:1.2}.svc ul{margin:0;padding-inline-start:1.1rem;color:var(--muted);font-size:.98rem}.svc li+li{margin-top:.3rem}.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:1.1rem;margin-top:2rem}.client{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}.logo{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;padding:1rem;background:var(--line)}.logo.full{padding:0}.logo.full img{width:100%;height:100%;object-fit:cover}.logo img{width:auto;height:auto;max-width:100%;max-height:100%;display:block}.client figcaption{padding:.8rem 1.1rem;font-weight:500;border-top:1px solid var(--line)}.mono{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 1.5rem "Bricolage Grotesque",sans-serif;background:linear-gradient(135deg,#0B2545,#1B6CB0 55%,#17B5A0)}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:1.25rem;margin-top:2rem}.member{margin:0}.member img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:18px;display:block;background:var(--line)}.member figcaption{padding:.8rem .2rem 0}.member b{display:block;font:700 1.15rem "Bricolage Grotesque",sans-serif}.member span{color:var(--muted)}
.phone{margin:1rem 0 0;opacity:.85}.wa{position:fixed;inset-inline-end:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:.5rem;background:#0B7A3E;color:#fff;padding:.75rem 1.1rem;border-radius:999px;text-decoration:none;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.bsearch{width:100%;max-width:420px;margin-top:1.5rem;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.7rem 1.2rem}.client figcaption b{display:block;font:700 1.1rem "Bricolage Grotesque",sans-serif}.client figcaption .tag{display:block}.client figcaption p{margin:.4rem 0 0;color:var(--muted);font-size:.95rem}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);padding:1.5rem;width:min(92vw,520px);max-height:88vh;overflow:auto}dialog::backdrop{background:rgba(7,23,44,.62)}.x{position:absolute;top:.5rem;inset-inline-end:.8rem;font:inherit;font-size:1.8rem;line-height:1;background:none;border:0;color:var(--ink);cursor:pointer}#workBody .logo{border-radius:14px;margin-bottom:1rem}#workBody h3{font-size:1.6rem;margin-bottom:.5rem}#workBody p{color:var(--muted);margin:0}.wlinks{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.3rem}.client.has-work{cursor:pointer}.client.has-work:hover{border-color:var(--accent)}
header.top{position:fixed;top:0;left:0;right:0;z-index:25;padding:calc(.7rem + env(safe-area-inset-top,0px)) max(clamp(1.25rem,5vw,3rem),calc((100% - 1120px)/2 + clamp(1.25rem,5vw,3rem))) .7rem;background:transparent;border-bottom:1px solid transparent;transition:background .35s,border-color .35s,backdrop-filter .35s}
header.top.scrolled{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.brand img{transition:height .35s ease}header.top.scrolled .brand img{height:28px}
header.top nav{min-width:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.hero{padding-top:clamp(6.5rem,15vw,10rem)}
#prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:40;background:linear-gradient(90deg,var(--accent),var(--teal));transform:scaleX(0);transform-origin:0 50%}
.heromark{will-change:transform}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.hero>:nth-child(n+2){animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero>:nth-child(2){animation-delay:.05s}.hero>:nth-child(3){animation-delay:.2s}.hero>:nth-child(4){animation-delay:.35s}.hero>:nth-child(5){animation-delay:.5s}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
.svc,.client,.btn,.lang button,.member img{transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
.svc,.client{position:relative;overflow:hidden}
.svc:hover,.client.has-work:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(11,37,69,.16)}
.member:hover img{transform:scale(1.03)}.member{overflow:hidden}
.btn{position:relative;overflow:hidden}.btn:hover{transform:translateY(-2px)}.btn:active,.client:active{transform:scale(.97)}
.lang button{position:relative;overflow:hidden}.wa{overflow:hidden;transition:transform .25s}.wa:hover{transform:scale(1.06)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rip .65s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
dialog[open]{animation:pop .28s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
@media (max-width:560px){nav a{margin-left:1rem}.proj:first-child .thumb{text-shadow:0 1px 8px rgba(0,0,0,.25);aspect-ratio:16/9}}
</style>
</head>

const $ = id => document.getElementById(id);
$("brand").textContent = SITE.name;
$("heromark").src = document.querySelector(".brand img").src;
$("headline").textContent = SITE.headline;
$("intro").textContent = SITE.intro;
$("ctaTitle").textContent = SITE.contactTitle;
$("ctaLink").textContent = SITE.contactLabel;
$("ctaLink").href = SITE.contactHref;
$("ctaLink").target = "_blank"; $("ctaLink").rel = "noopener";
$("ctaPhone").textContent = SITE.phone;
$("ctaEmail").textContent = SITE.email; $("ctaEmail").href = "mailto:" + SITE.email;
$("waFab").href = SITE.contactHref; $("waFab").target = "_blank"; $("waFab").rel = "noopener";
$("footer").textContent = SITE.footer;
$("stats").innerHTML = SITE.stats.map(s => `<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join("");

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function drawClients(){
  const t = CLIENT_TEXT[svcLang], w = $("work");
  w.dir = SVC_TEXT[svcLang].dir; w.lang = svcLang;
  $("clTitle").textContent = t.title; $("clLead").textContent = t.lead;
  $("grid").innerHTML = CLIENTS.map(n => {
    const L = LOGOS[n], wk = WORK[n];
    const art = L ? `<div class="logo${L.full ? ' full' : ''}" style="background:linear-gradient(${esc(L.top)},${esc(L.bottom)})"><img src="${L.src}" alt="${esc(n)} logo"></div>`
                  : `<div class="logo"><div class="mono" aria-hidden="true">${esc(n[0])}</div></div>`;
    return `<figure class="client${wk ? ' has-work' : ''}"${wk ? ` data-n="${esc(n)}" tabindex="0" role="button"` : ''}>${art}<figcaption dir="ltr">${esc(n)}${wk ? `<span class="tag" dir="auto">${esc(VIEW[svcLang])}</span>` : ''}${PENDING.includes(n) ? `<span class="tag" dir="auto">${esc(SOON[svcLang])}</span>` : ''}</figcaption></figure>`;
  }).join("");
}

function drawTeam(){
  const t = TEAM_TEXT[svcLang], s = $("team");
  s.dir = SVC_TEXT[svcLang].dir; s.lang = svcLang;
  $("tmTitle").textContent = t.title; $("tmLead").textContent = t.lead;
  $("teamGrid").innerHTML = TEAM.map((m,i) => `<figure class="member"><img src="${TEAM_PHOTOS[i]||""}" alt="${esc(m.name)}"><figcaption><b>${esc(m.name)}</b><span>${esc(m.role)}</span></figcaption></figure>`).join("");
}

function openWork(n){
  const w = WORK[n], L = LOGOS[n], d = $("workDlg"), l = svcLang;
  d.dir = SVC_TEXT[l].dir; d.lang = l;
  $("workBody").innerHTML = (L ? `<div class="logo${L.full ? ' full' : ''}" style="background:linear-gradient(${esc(L.top)},${esc(L.bottom)})"><img src="${L.src}" alt="${esc(n)} logo"></div>` : "")
    + `<h3 dir="ltr">${esc(n)}</h3>` + (w.about ? `<p>${esc(w.about[l])}</p>` : "")
    + `<div class="wlinks">${w.links.map(k => `<a class="btn" href="${esc(k.url)}" target="_blank" rel="noopener">${esc(k.label[l])}</a>`).join("")}</div>`;
  d.showModal();
}
$("grid").addEventListener("click", e => { const c = e.target.closest(".client[data-n]"); if(c) openWork(c.dataset.n); });
$("grid").addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== " ") return;
  const c = e.target.closest(".client[data-n]"); if(c){ e.preventDefault(); openWork(c.dataset.n); }
});
$("workDlg").addEventListener("click", e => { if(e.target === $("workDlg") || e.target.closest(".x")) $("workDlg").close(); });

let brQ = "";
function drawBrands(){
  const sec = $("brands"), has = BRANDS.length > 0;
  sec.hidden = !has; $("brNav").hidden = !has;
  if(!has) return;
  const t = BRAND_TEXT[svcLang];
  sec.dir = SVC_TEXT[svcLang].dir; sec.lang = svcLang;
  $("brTitle").textContent = t.title; $("brLead").textContent = t.lead;
  $("brSearch").placeholder = t.search; $("brSearch").hidden = BRANDS.length < 4;
  const q = brQ.trim().toLowerCase();
  const list = BRANDS.filter(b => !q || (b.name + " " + (b.field||"") + " " + (b.text||"")).toLowerCase().includes(q));
  $("brGrid").innerHTML = list.length ? list.map(b => {
    const L = LOGOS[b.name];
    const art = L ? `<div class="logo${L.full ? ' full' : ''}" style="background:linear-gradient(${esc(L.top)},${esc(L.bottom)})"><img src="${L.src}" alt="${esc(b.name)} logo"></div>`
                  : `<div class="logo"><div class="mono" aria-hidden="true">${esc(b.name[0])}</div></div>`;
    return `<figure class="client">${art}<figcaption dir="auto"><b>${esc(b.name)}</b>${b.field ? `<span class="tag">${esc(b.field)}</span>` : ""}${b.text ? `<p>${esc(b.text)}</p>` : ""}</figcaption></figure>`;
  }).join("") : `<p class="svc-lead">${t.none}</p>`;
}
$("brSearch").addEventListener("input", e => { brQ = e.target.value; drawBrands(); });

let svcLang = "en";
function drawServices(){
  const t = SVC_TEXT[svcLang], i = svcLang==="en" ? 0 : 1;
  const sec = $("services"); sec.dir = t.dir; sec.lang = svcLang;
  $("svcTitle").textContent = t.title; $("svcLead").textContent = t.lead;
  drawClients(); drawTeam(); drawBrands();
  $("svcGrid").innerHTML = SERVICES.map(s => `<article class="svc"><h3>${esc(s[i])}</h3><ul>${s[i+2].map(x => `<li>${esc(x)}</li>`).join("")}</ul></article>`).join("");
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l===svcLang));
  observeReveals();
}
document.querySelector(".lang").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  svcLang = b.dataset.l; drawServices();
});
drawServices();

$("updateList").innerHTML = UPDATES.map(u => {
  const d = new Date(u.date + "T00:00:00").toLocaleDateString("en-GB", {day:"numeric", month:"long", year:"numeric"});
  return `<li><time datetime="${esc(u.date)}">${d}</time><h3>${esc(u.title)}</h3><p>${esc(u.text)}</p></li>`;
}).join("");

/* Motion: scroll header, progress bar, parallax logo, reveals, count-up, click ripples */
var RM = matchMedia("(prefers-reduced-motion: reduce)").matches, rio;
function observeReveals(){
  if(RM || !("IntersectionObserver" in window)) return;
  rio = rio || new IntersectionObserver(es => es.forEach(e => {
    if(!e.isIntersecting) return;
    const el = e.target; el.classList.add("in"); rio.unobserve(el);
    setTimeout(() => { el.style.transitionDelay = ""; }, 1100);
  }), {threshold:.12});
  document.querySelectorAll(".svc,.client,.member,.updates li,section h2,.svc-lead,.contact").forEach((el,i) => {
    if(el.dataset.rv) return;
    el.dataset.rv = 1; el.classList.add("rv"); el.style.transitionDelay = (i % 6) * 60 + "ms"; rio.observe(el);
  });
}
observeReveals();

const hdr = document.querySelector("header.top"), bar = $("prog"), hm = $("heromark");
let tick = false;
function onScroll(){
  tick = false;
  const y = window.scrollY, max = document.documentElement.scrollHeight - innerHeight;
  hdr.classList.toggle("scrolled", y > 24);
  bar.style.transform = "scaleX(" + (max > 0 ? Math.min(y / max, 1) : 0) + ")";
  if(!RM) hm.style.transform = "translateY(calc(-52% + " + Math.min(y * .22, 520) + "px)) rotate(" + (y * .03) + "deg)";
}
addEventListener("scroll", () => { if(!tick){ tick = true; requestAnimationFrame(onScroll); } }, {passive:true});
onScroll();

if(!RM && "IntersectionObserver" in window){
  const so = new IntersectionObserver(es => es.forEach(e => {
    if(!e.isIntersecting) return;
    so.unobserve(e.target);
    const el = e.target, end = parseInt(el.textContent, 10), sfx = el.textContent.replace(/^\d+/, "");
    if(isNaN(end)) return;
    const t0 = performance.now();
    (function step(t){ const p = Math.min((t - t0) / 900, 1); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))) + sfx; if(p < 1) requestAnimationFrame(step); })(t0);
  }), {threshold:.6});
  document.querySelectorAll(".stats b").forEach(b => so.observe(b));
}

document.addEventListener("pointerdown", e => {
  if(RM) return;
  const t = e.target.closest(".btn,.client,.svc,.wa,.lang button"); if(!t) return;
  const r = t.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2, d = document.createElement("span");
  d.className = "rip";
  d.style.cssText = "width:" + s + "px;height:" + s + "px;left:" + (e.clientX - r.left - s / 2) + "px;top:" + (e.clientY - r.top - s / 2) + "px";
  t.appendChild(d); setTimeout(() => d.remove(), 700);
});
</script>
